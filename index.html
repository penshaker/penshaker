    <h1><u>Air, wind, power, force</u><br>
Whipped like a gate,<br>
a thousand dreams swept aside.<br>
Whilst Solid minds seek the rescue of ragged dreams,<br>
those that are pliant expand and turn sail for new</h1>
    <p>Poems from a shaky pen.</p>
