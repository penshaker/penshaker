<body>
    <h1><u>Bellowing Change</u><br>
Whipped like a gate,<br>
a thousand dreams swept aside.<br>
Solid minds seek to rescue ragged dreams,<br>
later pliant, expand and turn sail for new</h1>
    <p>Poems from a shaky pen.</p>
