    <h1>Air, wind, power, force<br>
Whipped like a gate<br>
A thousand dreams swept aside.<br>
Whilst Solid minds fight for ragged dreams,<br>
Pliant minds sail to new</h1>
    <p>Poems from a shaky pen.</p>
